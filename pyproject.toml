[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "safe-bit"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
license = "AGPL-3.0-only"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = [
  "cryptography",
  "fastapi[standard]",
]

[dependency-groups]
dev = [
  "pytest>=8",
  "cryptography",
  "fastapi[standard]",
  "ruff",
]

[tool.hatch.build.targets.wheel]
packages = ["src/safe_bit"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.pyright]
extraPaths = ["src"]
venvPath = ".devenv/state"
venv = "venv"

[tool.ruff]
target-version = "py314"
